openapi: 3.0.3
info:
  title: Контур удержания — API
  version: "0.2.0"
  description: |
    Контракт каркаса «Контура удержания»: слои 1 и 2 кейса. Деньги — целые евроценты (int64).
    Ошибки — application/problem+json (RFC 9457) с correlation_id = X-Request-Id.
    Пока модуль не реализован, его пути отвечают 501.
servers:
  - url: /
tags:
  - name: auth
  - name: customers
  - name: analytics
  - name: model
  - name: source
  - name: audit
  - name: tasks
  - name: platform
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: Сессия, выданная POST /api/v1/auth/login.
    bearerAuth:
      type: http
      scheme: bearer
      description: Тот же токен сессии в заголовке Authorization.
    serviceToken:
      type: http
      scheme: bearer
      description: Сервисный токен источника данных (PUT /source/snapshot).
    metricsToken:
      type: http
      scheme: bearer
      description: Токен сборщика метрик Prometheus.
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: UUID запроса. Корректный возвращается нормализованным, иначе сервер генерирует новый.
      schema:
        type: string
        format: uuid
    CustomerId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ServiceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    AccountId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  headers:
    RequestId:
      description: UUID запроса (из запроса или новый).
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Нет действующей сессии
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Роли не хватает для операции
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: Запрос не прошёл проверку
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Не найдено
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Конфликт задачи удержания; task — её текущее состояние
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/TaskConflict"
    UnprocessableEntity:
      description: Снимок не прошёл проверку связей и значений; errors[] — по полям
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotImplemented:
      description: Модуль ещё не реализован
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        correlation_id:
          type: string
          description: Равен заголовку X-Request-Id.
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
    Role:
      type: string
      enum: [marketer, analyst, admin, jury]
    User:
      type: object
      required: [id, login, role]
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
        role:
          $ref: "#/components/schemas/Role"
    AuthConfig:
      type: object
      required: [ssoEnabled]
      properties:
        ssoEnabled:
          type: boolean
          description: Вход через SSO настроен на сервере. Адрес провайдера и другие настройки не раскрываются.
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
        password:
          type: string
          format: password
        totp:
          type: string
          description: Одноразовый код, если у пользователя включён TOTP.
    LoginResult:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
          description: Токен сессии для bearerAuth (дублирует cookie).
        csrfToken:
          type: string
    Account:
      type: object
      required: [id, email, balance, withdrawBalance, totalReplenished, bonusBalance, bonusState]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        balance:
          type: integer
          format: int64
          minimum: 0
        withdrawBalance:
          type: integer
          format: int64
          minimum: 0
        totalReplenished:
          type: integer
          format: int64
          minimum: 0
        bonusBalance:
          type: integer
          format: int64
          minimum: 0
        bonusState:
          type: string
          enum: [locked, unlocked]
    PaymentTerm:
      type: string
      enum: [hour, week, month, quarter_year, half_year, year]
    ServiceStatus:
      type: string
      enum: [active, blocked, deleted, suspended, prolong_wait]
    Service:
      type: object
      required: [id, name, ownerId, paymentTerm, autoProlong, createdAt, expiresAt, status, price]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          pattern: '^[A-Za-z0-9-]+$'
        ownerId:
          type: integer
          format: int64
        paymentTerm:
          $ref: "#/components/schemas/PaymentTerm"
        autoProlong:
          type: boolean
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/ServiceStatus"
        price:
          type: integer
          format: int64
          minimum: 0
    Transaction:
      type: object
      required: [id, amount, status, createdAt, type, serviceId]
      properties:
        id:
          type: integer
          format: int64
        amount:
          type: integer
          minimum: 0
          maximum: 1000
        status:
          type: string
          enum: [not_performed, performed]
        performedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        type:
          type: string
          enum: [prolong, order]
        serviceId:
          type: integer
          format: int64
    Snapshot:
      type: object
      required: [accounts, services, transactions]
      properties:
        asOf:
          type: string
          format: date-time
          description: Момент, на который снят снимок. Без него модель берёт время сервера.
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/Account"
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
    SnapshotAccepted:
      type: object
      required: [version, asOf, accounts, services, transactions]
      properties:
        version:
          type: integer
          format: int64
        asOf:
          type: string
          format: date-time
          description: Время модели этого снимка.
        accounts:
          type: integer
        services:
          type: integer
        transactions:
          type: integer
    QualityCheck:
      type: object
      required: [id, ok]
      properties:
        id:
          type: string
        ok:
          type: boolean
        message:
          type: string
        items:
          type: array
          description: Услуги, на которых проверка сработала; не больше 10.
          items:
            $ref: "#/components/schemas/QualityCheckItem"
    QualityCheckItem:
      type: object
      required: [serviceId, accountId]
      properties:
        serviceId:
          type: integer
          format: int64
        accountId:
          type: integer
          format: int64
    SourceStatus:
      type: object
      required: [version, loadedAt, ageSeconds, checks]
      properties:
        version:
          type: integer
          format: int64
        source:
          type: string
          enum: [seed, api, emulator]
          description: Откуда загружен текущий снимок.
        asOf:
          type: string
          format: date-time
        loadedAt:
          type: string
          format: date-time
        ageSeconds:
          type: integer
          format: int64
        checks:
          type: array
          items:
            $ref: "#/components/schemas/QualityCheck"
        polling:
          $ref: "#/components/schemas/SourcePolling"
    SourcePolling:
      type: object
      description: Опрос REST-биллинга (BILLING_URL). Нет поля в статусе — опрос не настроен.
      required: [paused, intervalSeconds, errorsTotal]
      properties:
        paused:
          type: boolean
          description: Опрос на паузе (после ручной загрузки снимка), пока его не включат.
        intervalSeconds:
          type: integer
        lastOkAt:
          type: string
          format: date-time
          description: Последний удачный опрос.
        lastError:
          type: string
          description: Причина последнего сбоя; пусто, если последний опрос удался.
        errorsTotal:
          type: integer
          format: int64
    SourcePollingRequest:
      type: object
      required: [paused]
      properties:
        paused:
          type: boolean
    ServicePatch:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ServiceStatus"
        autoProlong:
          type: boolean
        expiresAt:
          type: string
          format: date-time
    AccountPatch:
      type: object
      properties:
        balance:
          type: integer
          format: int64
          minimum: 0
        bonusBalance:
          type: integer
          format: int64
          minimum: 0
    EmulatorTickRequest:
      type: object
      properties:
        days:
          type: integer
          minimum: 1
          default: 1
        hours:
          type: integer
          minimum: 1
          description: Сдвиг в часах; если задан, days игнорируется
    EmulatorAction:
      type: object
      required: [customerId, actionId]
      properties:
        customerId:
          type: integer
          format: int64
        actionId:
          type: string
          description: "top_up (нужен cents), enable_autoprolong, reset (customerId игнорируется)"
        cents:
          type: integer
          format: int64
          description: Сумма пополнения в евроцентах, только для top_up
    EmulatorActionsRequest:
      type: object
      required: [actions]
      properties:
        actions:
          type: array
          items:
            $ref: "#/components/schemas/EmulatorAction"
    RiskLevel:
      type: string
      enum: [high, medium, low, unscored, lost]
    CustomerRow:
      type: object
      required: [id, email, balance, totalReplenished, level, expectedLossCents]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        balance:
          type: integer
          format: int64
        totalReplenished:
          type: integer
          format: int64
        score:
          type: number
          format: double
          nullable: true
          description: Риск оттока в процентах 0..100 (как порог модели); null для unscored и lost.
        level:
          $ref: "#/components/schemas/RiskLevel"
        expectedLossCents:
          type: integer
          format: int64
        lostCents:
          type: integer
          format: int64
          description: Условная стоимость неживых услуг (deleted/blocked) за горизонт модели; 0 у клиентов без потерянных услуг. Расчёт по ценам услуг, не фактическая выручка.
        topReason:
          type: string
          description: Главная причина простыми словами; нет у unscored и lost.
        topAction:
          $ref: "#/components/schemas/ActionBrief"
        expiresAt:
          type: string
          format: date-time
          description: Окно спасения — срок услуги в ожидании оплаты (prolong_wait).
        deleteAt:
          type: string
          format: date-time
          description: Когда услугу в ожидании оплаты удалят (expiresAt + 5 дней).
        billing:
          type: boolean
          description: Тег «к биллингу» — сбой автосписания, а не отток.
        task:
          $ref: "#/components/schemas/TaskBrief"
    ActionBrief:
      type: object
      required: [id, title, effectCents]
      properties:
        id:
          type: string
        title:
          type: string
        effectCents:
          type: integer
          format: int64
    CustomerPage:
      type: object
      required: [items, total, version]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CustomerRow"
        total:
          type: integer
        version:
          type: integer
          format: int64
          description: Версия пересчёта, по которому построена страница.
    TaskStatus:
      type: string
      description: "В работе, связались, отложено, закрыто."
      enum: [in_work, contacted, postponed, closed]
    TaskOutcome:
      type: string
      description: "Итог закрытой задачи: продлил, отказался, не ответил, не нужно."
      enum: [renewed, refused, no_answer, not_needed]
    TaskChannel:
      type: string
      description: "Канал контакта: почта (mail), телефон, мессенджер, другое."
      enum: [mail, phone, messenger, other]
    TaskBrief:
      type: object
      description: Открытая задача клиента в строке очереди и в карточке.
      required: [id, status, assignee, dueAt, overdue]
      properties:
        id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/TaskStatus"
        assignee:
          type: string
          description: Логин ответственного.
        dueAt:
          type: string
          format: date-time
        overdue:
          type: boolean
          description: Срок прошёл (по часам сервера) и задача не закрыта.
    TaskServiceBaseline:
      type: object
      required: [id, status, autoProlong, expiresAt]
      properties:
        id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/ServiceStatus"
        autoProlong:
          type: boolean
        expiresAt:
          type: string
          format: date-time
    TaskBaseline:
      type: object
      description: Исходное состояние клиента в момент, когда его взяли в работу. Не меняется.
      required: [version, level, expectedLossCents, balance, services]
      properties:
        version:
          type: integer
          format: int64
          description: Версия пересчёта, из которого взято состояние.
        asOf:
          type: string
          format: date-time
          description: Время модели на этот пересчёт.
        score:
          type: number
          format: double
          nullable: true
        level:
          $ref: "#/components/schemas/RiskLevel"
        expectedLossCents:
          type: integer
          format: int64
        topAction:
          $ref: "#/components/schemas/ActionBrief"
        balance:
          type: integer
          format: int64
        services:
          type: array
          items:
            $ref: "#/components/schemas/TaskServiceBaseline"
    TaskEvent:
      type: object
      required: [id, at, actor, kind, text, changes]
      properties:
        id:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        actor:
          type: string
        kind:
          type: string
          enum: [created, changed, contact, note]
        channel:
          $ref: "#/components/schemas/TaskChannel"
        text:
          type: string
        changes:
          type: array
          description: Что поменялось в задаче; пусто у контакта и заметки.
          items:
            $ref: "#/components/schemas/AuditChange"
    RetentionTask:
      type: object
      required: [id, customerId, status, assignee, dueAt, overdue, note, version, customerMissing, baseline, createdBy, createdAt, updatedAt, updatedBy]
      properties:
        id:
          type: integer
          format: int64
        customerId:
          type: integer
          format: int64
        customerEmail:
          type: string
          description: Email клиента на момент, когда его взяли в работу.
        status:
          $ref: "#/components/schemas/TaskStatus"
        outcome:
          $ref: "#/components/schemas/TaskOutcome"
        assignee:
          type: string
        dueAt:
          type: string
          format: date-time
        overdue:
          type: boolean
        note:
          type: string
        version:
          type: integer
          format: int64
          description: Номер правки; передаётся в PATCH.
        customerMissing:
          type: boolean
          description: Клиента нет в текущем снимке или у его ID другой email.
        baseline:
          $ref: "#/components/schemas/TaskBaseline"
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
        closedAt:
          type: string
          format: date-time
        events:
          type: array
          description: История по порядку, старые сверху. Есть в ответах по одной задаче, в списке нет.
          items:
            $ref: "#/components/schemas/TaskEvent"
    TaskConflict:
      description: Problem с текущей задачей.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            task:
              $ref: "#/components/schemas/RetentionTask"
    TaskPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RetentionTask"
        total:
          type: integer
    TaskCreate:
      type: object
      description: Необязательные поля; по умолчанию срок — завтра 18:00 МСК, ответственный — текущий пользователь.
      properties:
        assignee:
          type: string
        dueAt:
          type: string
          format: date-time
        note:
          type: string
          maxLength: 2000
    TaskPatch:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int64
          description: Версия, которую видел автор правки.
        status:
          $ref: "#/components/schemas/TaskStatus"
        outcome:
          $ref: "#/components/schemas/TaskOutcome"
        assignee:
          type: string
        dueAt:
          type: string
          format: date-time
        note:
          type: string
          maxLength: 2000
    TaskEventCreate:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [contact, note]
        channel:
          $ref: "#/components/schemas/TaskChannel"
        text:
          type: string
          maxLength: 2000
    TaskAssignee:
      type: object
      required: [login, role]
      properties:
        login:
          type: string
        role:
          $ref: "#/components/schemas/Role"
    TaskAssignees:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TaskAssignee"
    AuditChange:
      type: object
      required: [field, from, to]
      properties:
        field:
          type: string
          description: Что поменялось (например, weights.noauto)
        from:
          type: string
          description: Значение до правки, текстом
        to:
          type: string
          description: Значение после правки, текстом
    AuditEntry:
      type: object
      required: [id, at, actor, action, summary, changes]
      properties:
        id:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        actor:
          type: string
          description: Логин того, кто действовал; при неудачном входе — введённый логин
        action:
          type: string
          enum: [login, loginFailed, logout, settingsChanged, snapshotLoaded, serviceChanged, accountChanged, emulatorTick, emulatorActions, taskCreated, taskChanged, taskRecorded]
        summary:
          type: string
          description: Запись простыми словами
        changes:
          type: array
          description: Что было и что стало; пусто, если запись без правок значений
          items:
            $ref: "#/components/schemas/AuditChange"
    AuditPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        total:
          type: integer
    Feature:
      type: object
      required: [id, value, weight, contribution, reason]
      properties:
        id:
          type: string
        value:
          type: number
          format: double
        weight:
          type: number
          format: double
        contribution:
          type: number
          format: double
        reason:
          type: string
    Action:
      type: object
      required: [id, title, effectCents, newScore, newLevel]
      properties:
        id:
          type: string
        title:
          type: string
        effectCents:
          type: integer
          format: int64
        newScore:
          type: number
          format: double
          description: Риск после действия, 0..100.
        newLevel:
          $ref: "#/components/schemas/RiskLevel"
    ServiceRisk:
      type: object
      required: [serviceId, probability, rCents, lossCents, features, quality]
      properties:
        serviceId:
          type: integer
          format: int64
        probability:
          type: number
          format: double
          description: Вероятность непродления услуги 0..1.
        rCents:
          type: integer
          format: int64
          description: Сумма под угрозой R за горизонт, центы.
        lossCents:
          type: integer
          format: int64
        features:
          type: array
          items:
            $ref: "#/components/schemas/Feature"
        quality:
          type: array
          description: Сработавшие проверки качества данных.
          items:
            type: string
    CustomerDetail:
      type: object
      required: [customer, services, features, actions, version]
      properties:
        version:
          type: integer
          format: int64
          description: Версия пересчёта.
        serviceRisks:
          type: array
          description: Оценка каждой живой услуги.
          items:
            $ref: "#/components/schemas/ServiceRisk"
        customer:
          $ref: "#/components/schemas/CustomerRow"
        account:
          $ref: "#/components/schemas/Account"
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"
        features:
          type: array
          items:
            $ref: "#/components/schemas/Feature"
        actions:
          type: array
          items:
            $ref: "#/components/schemas/Action"
        explanation:
          type: string
    Summary:
      type: object
      required: [levels, expectedLossCents, atRiskCents, lostCents, version]
      properties:
        levels:
          type: object
          required: [high, medium, low, unscored, lost]
          properties:
            high:
              type: integer
            medium:
              type: integer
            low:
              type: integer
            unscored:
              type: integer
            lost:
              type: integer
        expectedLossCents:
          type: integer
          format: int64
        atRiskCents:
          type: integer
          format: int64
        lostCents:
          type: integer
          format: int64
        asOf:
          type: string
          format: date-time
        qualityCounts:
          type: object
          description: Сколько услуг и клиентов отмечено каждой проверкой качества данных
          additionalProperties:
            type: integer
        version:
          type: integer
          format: int64
    ChurnPoint:
      type: object
      required: [weekStart, actual, forecast]
      properties:
        weekStart:
          type: string
          format: date
        actual:
          type: integer
          nullable: true
        forecast:
          type: integer
          nullable: true
    ChurnChart:
      type: object
      required: [points]
      properties:
        points:
          type: array
          items:
            $ref: "#/components/schemas/ChurnPoint"
    ModelSettings:
      type: object
      required: [weights, thresholds, horizonDays, priceBasis, asOfMode, version]
      properties:
        weights:
          type: object
          additionalProperties:
            type: number
            format: double
        thresholds:
          type: object
          required: [high, medium]
          properties:
            high:
              type: number
              format: double
            medium:
              type: number
              format: double
        horizonDays:
          type: integer
          minimum: 1
        priceBasis:
          type: string
          enum: [per_period, per_month]
        asOfMode:
          type: string
          enum: [snapshot, server]
        version:
          type: integer
          format: int64
        updatedBy:
          type: string
          description: Кто сохранил эту версию; для версии 0 (умолчания) поля нет.
        updatedAt:
          type: string
          format: date-time
          description: Когда сохранена версия; для версии 0 (умолчания) поля нет.
    ModelSettingsPatch:
      type: object
      properties:
        weights:
          type: object
          additionalProperties:
            type: number
            format: double
        thresholds:
          type: object
          properties:
            high:
              type: number
              format: double
            medium:
              type: number
              format: double
        horizonDays:
          type: integer
          minimum: 1
        priceBasis:
          type: string
          enum: [per_period, per_month]
        asOfMode:
          type: string
          enum: [snapshot, server]
    DryRunResult:
      type: object
      required: [levelChanges, expectedLossDeltaCents]
      properties:
        levelChanges:
          type: object
          additionalProperties:
            type: integer
          description: Ключ вида «medium->high», значение — число клиентов.
        expectedLossDeltaCents:
          type: integer
          format: int64
        customers:
          type: array
          maxItems: 50
          description: Клиенты со сменой уровня, по убыванию модуля expectedLossDeltaCents; не больше 50.
          items:
            $ref: "#/components/schemas/DryRunCustomer"
        customersTotal:
          type: integer
          minimum: 0
          description: Сколько всего клиентов меняет уровень (может быть больше длины customers).
    DryRunCustomer:
      type: object
      required: [id, name, levelFrom, levelTo, scoreFrom, scoreTo, expectedLossDeltaCents]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: Как клиент называется в очереди (email аккаунта).
        levelFrom:
          type: string
        levelTo:
          type: string
        scoreFrom:
          type: number
          format: double
        scoreTo:
          type: number
          format: double
        expectedLossDeltaCents:
          type: integer
          format: int64
paths:
  /healthz:
    get:
      operationId: healthz
      tags: [platform]
      security: []
      summary: Проверка живости
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Сервер работает
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /version:
    get:
      operationId: version
      tags: [platform]
      security: []
      summary: Версия сборки
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Версия из APP_VERSION, по умолчанию dev
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version:
                    type: string
  /ping:
    get:
      operationId: ping
      tags: [platform]
      security: []
      summary: Проверка связи без кэша
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Ответ pong, заголовок Cache-Control no-store
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                type: object
                required: [ping]
                properties:
                  ping:
                    type: string
                    enum: [pong]
    head:
      operationId: pingHead
      tags: [platform]
      security: []
      summary: Проверка связи без кэша, без тела ответа
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Заголовки как у GET, тела нет
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
  /api/v1/docs:
    get:
      operationId: docs
      tags: [platform]
      security: []
      summary: Swagger UI (открыт, файлы вшиты в бинарь)
      responses:
        "200":
          description: HTML-страница Swagger UI
          content:
            text/html:
              schema:
                type: string
  /api/v1/openapi.yml:
    get:
      operationId: openapiYaml
      tags: [platform]
      security: []
      summary: Контракт в YAML (открыт)
      responses:
        "200":
          description: Файл api/openapi.yaml
          content:
            application/yaml:
              schema:
                type: string
  /api/v1/openapi.json:
    get:
      operationId: openapiJson
      tags: [platform]
      security: []
      summary: Контракт в JSON (открыт)
      responses:
        "200":
          description: Тот же контракт в JSON
          content:
            application/json:
              schema:
                type: object
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      security: []
      summary: Вход по логину и паролю (открыт)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Сессия создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Текущий пользователь
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Пользователь
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Завершение текущей сессии
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Сессия завершена
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/auth/config:
    get:
      operationId: getAuthConfig
      tags: [auth]
      security: []
      summary: Настройки входа для экрана входа (открыт)
      responses:
        "200":
          description: Что показывать на экране входа
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"
  /api/v1/auth/oidc/login:
    get:
      operationId: oidcLogin
      tags: [auth]
      security: []
      summary: Начало входа через OIDC (слой 2, открыт)
      responses:
        "302":
          description: Перенаправление на провайдера
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/auth/oidc/callback:
    get:
      operationId: oidcCallback
      tags: [auth]
      security: []
      summary: Возврат с OIDC-провайдера (слой 2, открыт)
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Сессия создана, перенаправление в приложение
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: Клиенты с оценкой риска; фильтр и сортировка рейтинга
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: level
          in: query
          schema:
            $ref: "#/components/schemas/RiskLevel"
        - name: q
          in: query
          description: Подстрока email или id
          schema:
            type: string
        - name: task
          in: query
          description: "Задача удержания: none — без открытой, open — с открытой, mine — открытая на мне."
          schema:
            type: string
            enum: [none, open, mine]
        - name: sort
          in: query
          schema:
            type: string
            enum: [id, email, balance, totalReplenished, score, expectedLoss]
            default: expectedLoss
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Страница клиентов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: "Подробная оценка клиента: услуги, признаки с вкладом, деньги, действия с ценой"
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: Карточка клиента
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/customers/{id}/task:
    post:
      operationId: takeCustomerTask
      tags: [tasks]
      summary: Взять клиента в работу (маркетолог, jury, администратор)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
      responses:
        "201":
          description: Задача создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionTask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: Задачи удержания с фильтрами; новые правки сверху
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TaskStatus"
        - name: assignee
          in: query
          description: Логин ответственного или me — текущий пользователь.
          schema:
            type: string
        - name: overdue
          in: query
          description: true — только просроченные открытые.
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Страница задач
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/tasks/assignees:
    get:
      operationId: listTaskAssignees
      tags: [tasks]
      summary: Кому можно назначить задачу
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Сотрудники
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskAssignees"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/tasks/{taskId}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Задача с историей
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Задача
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionTask"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    patch:
      operationId: patchTask
      tags: [tasks]
      summary: Изменить статус, ответственного, срок, заметку, итог (маркетолог, jury, администратор)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskPatch"
      responses:
        "200":
          description: Задача после правки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionTask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/tasks/{taskId}/events:
    post:
      operationId: addTaskEvent
      tags: [tasks]
      summary: Записать контакт или заметку в историю (маркетолог, jury, администратор)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskEventCreate"
      responses:
        "201":
          description: Задача с новым событием
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionTask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/analytics/summary:
    get:
      operationId: getSummary
      tags: [analytics]
      summary: Сводка риска и ожидаемых потерь
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Сводка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Первый пересчёт ещё не закончился
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/analytics/churn-chart:
    get:
      operationId: getChurnChart
      tags: [analytics]
      summary: Отток по неделям, факт и прогноз (слой 2)
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Ряд по неделям
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChurnChart"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/model/settings:
    get:
      operationId: getModelSettings
      tags: [model]
      summary: Действующие настройки и коэффициенты модели
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Настройки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          $ref: "#/components/responses/NotImplemented"
    patch:
      operationId: patchModelSettings
      tags: [model]
      summary: Изменение настроек с пересчётом; dryRun=true только считает последствия (аналитик)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: dryRun
          in: query
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelSettingsPatch"
      responses:
        "200":
          description: Новые настройки (dryRun=false) или последствия (dryRun=true)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ModelSettings"
                  - $ref: "#/components/schemas/DryRunResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/source/snapshot:
    put:
      operationId: putSnapshot
      tags: [source]
      summary: Загрузка или полная замена снимка данных с пересчётом (аналитик или сервисный токен)
      description: >-
        Принимаются также написания из текста кейса: поля pice, paymentTem, autoprolong и
        значения quater_year, pefomed, not_pefomed; в ответах — имена схемы.
      security:
        - cookieAuth: []
        - bearerAuth: []
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Snapshot"
      responses:
        "200":
          description: Снимок принят
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/source/status:
    get:
      operationId: getSourceStatus
      tags: [source]
      summary: Версия снимка, возраст, проверки качества
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Состояние источника
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/source/polling:
    put:
      operationId: setSourcePolling
      tags: [source]
      summary: Включить или поставить на паузу опрос REST-биллинга (аналитик)
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourcePollingRequest"
      responses:
        "200":
          description: Состояние опроса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourcePolling"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Опрос не настроен (BILLING_URL пуст)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/source/services/{id}:
    patch:
      operationId: patchService
      tags: [source]
      summary: Правка одной услуги (аналитик)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServicePatch"
      responses:
        "200":
          description: Услуга после правки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
