{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "churn.secretName" . }}
  labels: {{- include "churn.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secretEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- if .Values.postgres.enabled }}
  POSTGRES_PASSWORD: {{ required "postgres.password обязателен" .Values.postgres.password | quote }}
  DATABASE_URL: {{ printf "postgres://app:%s@%s-postgres:5432/app?sslmode=disable" .Values.postgres.password .Release.Name | quote }}
  {{- else }}
  DATABASE_URL: {{ required "postgres.externalUrl обязателен при postgres.enabled=false" .Values.postgres.externalUrl | quote }}
  {{- end }}
{{- end }}
