{{- if .Values.companions.enabled }}
# Keycloak и Grafana живут в Compose на хосте: Service без селектора + EndpointSlice на адрес хоста.
{{- range $name, $port := dict "keycloak" .Values.companions.keycloak.port "grafana" .Values.companions.grafana.port }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels: {{- include "churn.labels" $ | nindent 4 }}
spec:
  ports:
    - {name: http, port: 8080, targetPort: {{ $port }}, protocol: TCP}
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    kubernetes.io/service-name: {{ $.Release.Name }}-{{ $name }}
    {{- include "churn.labels" $ | nindent 4 }}
addressType: IPv4
ports:
  - {name: http, port: {{ $port }}, protocol: TCP}
endpoints:
  - addresses: [{{ $.Values.companions.hostAddress | quote }}]
---
{{- end }}
{{- end }}
