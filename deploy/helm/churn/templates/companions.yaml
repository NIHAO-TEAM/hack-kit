{{- if .Values.companions.enabled }}
# Keycloak и Grafana живут в Compose на хосте: Service без селектора + Endpoints на адрес хоста
# (Traefik берёт адреса из Endpoints; EndpointSlice создаётся из них зеркалированием).
{{- range $name, $port := dict "keycloak" .Values.companions.keycloak.port "grafana" .Values.companions.grafana.port }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels: {{- include "churn.labels" $ | nindent 4 }}
spec:
  ports:
    - {name: http, port: 8080, targetPort: {{ $port }}, protocol: TCP}
---
apiVersion: v1
kind: Endpoints
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels: {{- include "churn.labels" $ | nindent 4 }}
subsets:
  - addresses:
      - ip: {{ $.Values.companions.hostAddress | quote }}
    ports:
      - {name: http, port: {{ $port }}, protocol: TCP}
---
{{- end }}
{{- end }}
