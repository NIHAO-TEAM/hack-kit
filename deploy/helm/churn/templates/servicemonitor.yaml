{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "churn.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "churn.labels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      {{- if .Values.serviceMonitor.tokenSecret }}
      authorization:
        credentials:
          name: {{ .Values.serviceMonitor.tokenSecret }}
          key: token
      {{- end }}
{{- end }}
