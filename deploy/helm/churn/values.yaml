# Встраивание в контур — правка этого файла (или -f свой.yaml).

# Домен, по которому открывается сервис. Обязателен.
domain: ""

image:
  repository: churn-app
  # Тег — sha коммита; деплой задаёт --set image.tag=<sha>.
  tag: latest
  # Образ собирается на сервере и импортируется в k3s, реестра нет.
  pullPolicy: IfNotPresent

# Реплик API. 1 — прод, пока не проверена память узла (kubectl top); 2 и больше добавляют
# PodDisruptionBudget (minAvailable: 1) и мягкое распределение по узлам. Прогон: deploy-chaos.yml.
replicaCount: 1

resources:
  requests: {cpu: 250m, memory: 512Mi}
  limits: {memory: 1536Mi}

# Значения для env приложения, не секретные.
env:
  HTTP_ADDR: ":8080"
  DB_MAX_CONNS: "16"
  COOKIE_SECURE: "true"
  TRUSTED_PROXY: "true"
  SEED_ORGANIZERS: "false"
  # Гостевой вход (роль viewer, только просмотр): кнопка «Посмотреть как гость» на экране входа.
  GUEST_LOGIN_ENABLED: "true"
  # Мягкий предел памяти Go: ≈80 % от resources.limits.memory (1536Mi). Меняя лимит, меняйте и его.
  GOMEMLIMIT: "1200MiB"
  # Встраивание в контур — те же ключи, пример значений в values-aeza.example.yaml:
  #   BILLING_URL, BILLING_POLL_SECONDS — источник REST (токен BILLING_TOKEN — в Secret);
  #   OIDC_ISSUER_URL, OIDC_CLIENT_ID, OIDC_REDIRECT_URL — внешний IdP (OIDC_CLIENT_SECRET — в Secret).

# Секреты приложения (ADMIN_PASSWORD, METRICS_TOKEN, SOURCE_TOKEN, BILLING_TOKEN,
# OIDC_CLIENT_SECRET, DEMO_*_PASSWORD …). С existingSecret в нём же лежит DATABASE_URL.
# Пустой существующий секрет: existingSecret — имя Secret, который заведён вручную.
secretEnv: {}
existingSecret: ""

postgres:
  # true — свой Postgres в кластере (StatefulSet); false — внешний, адрес в externalUrl.
  enabled: true
  image: postgres:16-alpine
  password: ""
  storage: 5Gi
  storageClassName: ""
  resources:
    requests: {cpu: 250m, memory: 768Mi}
    limits: {memory: 2Gi}
  # Параметры сервера: shared_buffers 25 % лимита, effective_cache_size 75 %.
  # fsync и full_page_writes не трогаем.
  args:
    - -c
    - max_connections=100
    - -c
    - shared_buffers=512MB
    - -c
    - effective_cache_size=1536MB
    - -c
    - work_mem=16MB
    - -c
    - max_wal_size=4GB
    - -c
    - checkpoint_completion_target=0.9
    - -c
    - wal_compression=on
  # DATABASE_URL внешней базы (при enabled: false).
  externalUrl: ""

ingress:
  enabled: true
  className: traefik
  # Резолвер ACME, заведённый в Traefik (deploy/k3s/bootstrap.sh).
  certResolver: le
  # Либо Secret с сертификатом (если certResolver пуст).
  tlsSecret: ""

networkPolicy:
  enabled: true
  # Пространство имён Ingress-контроллера (в k3s Traefik в kube-system).
  ingressNamespace: kube-system

# Включается, когда в кластере есть prometheus-operator (этап 6: prometheus-prod).
serviceMonitor:
  enabled: false
  interval: 30s
  # Секрет с bearer-токеном /metrics: ключ token.
  tokenSecret: ""

# Спутники (Keycloak, Grafana) работают в Compose на том же сервере, вход один — Traefik.
# Service без селектора + EndpointSlice на адрес хоста; порты в Compose слушают только на этом адресе.
companions:
  enabled: true
  # Адрес docker0 на хосте, доступный из подов (COMPANIONS_BIND в ~/churn/.env).
  hostAddress: 172.17.0.1
  keycloak: {port: 18080}
  grafana: {port: 13000}
