# Пример встраивания в контур aéza: всё, что правится, — в этом файле.
#   helm upgrade --install churn deploy/helm/churn -n churn --create-namespace \
#     -f deploy/helm/churn/values-aeza.example.yaml --set image.tag=<sha>
# Значения секретов здесь не пишутся: они лежат в Secret `churn-aeza` (ключи — в конце файла).

domain: churn.example.aeza.internal

image:
  repository: churn-app
  tag: latest

ingress:
  enabled: true
  className: traefik
  # Чарт рассчитан на Traefik (CRD traefik.io). Сертификат выдан контуром, ACME-резолвера нет.
  certResolver: ""
  tlsSecret: churn-tls

networkPolicy:
  enabled: true
  # Пространство имён Ingress-контроллера контура.
  ingressNamespace: kube-system

env:
  HTTP_ADDR: ":8080"
  COOKIE_SECURE: "true"
  TRUSTED_PROXY: "true"
  SEED_ORGANIZERS: "false"
  # Источник REST: адрес и интервал опроса. Токен — BILLING_TOKEN в Secret.
  BILLING_URL: https://billing.example.aeza.internal/api/v1
  BILLING_POLL_SECONDS: "60"
  # OIDC внешнего Keycloak/IdP. Секрет клиента — OIDC_CLIENT_SECRET в Secret.
  OIDC_ISSUER_URL: https://sso.example.aeza.internal/realms/aeza
  OIDC_CLIENT_ID: churn
  OIDC_REDIRECT_URL: https://churn.example.aeza.internal/api/v1/auth/oidc/callback

# Готовый Secret контура. Ключи (значения не хранятся в репозитории):
#   DATABASE_URL, ADMIN_PASSWORD, METRICS_TOKEN, BILLING_TOKEN, OIDC_CLIENT_SECRET
existingSecret: churn-aeza

# Внешняя база: адрес — ключ DATABASE_URL в Secret выше, свой Postgres не создаётся.
postgres:
  enabled: false

# Prometheus контура (prometheus-operator) собирает /metrics.
serviceMonitor:
  enabled: true
  interval: 30s
  # Secret с ключом token = METRICS_TOKEN.
  tokenSecret: churn-metrics-token

# Keycloak и Grafana контура уже есть — спутники не нужны.
companions:
  enabled: false
