# Prometheus прода: опрашивает приложение по внутренней сети Compose. Наружу не публикуется.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: churn
    metrics_path: /metrics
    # Файл создаёт точка входа сервиса prometheus из METRICS_TOKEN (значение в конфиг не попадает).
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics_token
    static_configs:
      - targets: ["app:8080"]
