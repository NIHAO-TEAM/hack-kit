groups:
  - name: churn
    rules:
      - alert: ExpectedLossGrowth
        # Ожидаемая потеря выросла более чем на 20 % за час.
        expr: churn_expected_loss_cents > 1.2 * (churn_expected_loss_cents offset 1h) and (churn_expected_loss_cents offset 1h) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Ожидаемая потеря выросла более чем на 20 % за час"
      - alert: SnapshotStale
        # Снимок старше 10 минут: пересчёт не идёт.
        expr: churn_snapshot_age_seconds > 600
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Снимок риска старше 10 минут"
      - alert: ChurnTargetDown
        expr: up{job="churn"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus не достаёт /metrics приложения"
      - alert: RecalcSlow
        # Последний пересчёт длился дольше 5 секунд.
        expr: churn_recalc_duration_seconds > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Пересчёт риска длится дольше 5 секунд"
  - name: churn_http
    rules:
      - record: churn:http_request_duration_seconds:p95_5m
        # p95 длительности HTTP по шаблону маршрута.
        expr: histogram_quantile(0.95, sum by (le, route) (rate(churn_http_request_duration_seconds_bucket[5m])))
