# Прод: Postgres + приложение + Caddy (TLS). Запуск делает .github/workflows/deploy.yml:
#   docker compose -f deploy/docker-compose.prod.yml --env-file ~/churn/.env up -d --build
# Наружу публикуются только 80 и 443 (Caddy); база и приложение доступны внутри сети Compose.
name: churn

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?нет POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
    image: churn-app:${APP_TAG:-latest}
    restart: unless-stopped
    env_file: ${ENV_FILE:?задайте ENV_FILE (путь к .env прода)}
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@postgres:5432/app?sslmode=disable
      HTTP_ADDR: ":8080"
      APP_VERSION: ${APP_TAG:-dev}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    # В образе distroless нет shell и curl: проверка запускает сам бинарь.
    healthcheck:
      test: ["CMD", "/api", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Профиль sso включается в .env (COMPOSE_PROFILES=sso), если VM хватает памяти: bootstrap.sh.
  # Наружу не публикуется: Caddy проксирует /sso, админка и master-realm закрыты там же.
  keycloak:
    profiles: [sso]
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /sso
      KC_HOSTNAME: https://${PROD_DOMAIN:?нет PROD_DOMAIN в .env}/sso
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: kcadmin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-}
      KC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      KC_SECURE_PASSWORD: ${KC_SECURE_PASSWORD:-}
      KC_SECURE_TOTP_SECRET: ${KC_SECURE_TOTP_SECRET:-}
      PROD_DOMAIN: ${PROD_DOMAIN}
      JAVA_OPTS_KC_HEAP: -Xms256m -Xmx768m
    volumes:
      - ./keycloak/churn-realm.json:/opt/keycloak/data/import/churn-realm.json:ro
      - kcdata:/opt/keycloak/data
    expose:
      - "8080"
    # Для Traefik из k3s: только на адрес docker0 (COMPANIONS_BIND), снаружи порт закрыт.
    ports:
      - "${COMPANIONS_BIND:-127.0.0.1}:18080:8080"

  # Метрики: наружу не публикуются, только на COMPANIONS_BIND (диагностика).
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:?нет METRICS_TOKEN в .env}
      # Что опрашивать: в Compose — app:8080 по http; на k3s — https://<домен> через Traefik (.env).
      METRICS_TARGET: ${METRICS_TARGET:-app:8080}
      METRICS_SCHEME: ${METRICS_SCHEME:-http}
    # Токен сборщика пишется в файл при старте: в конфиге и в образе его нет.
    entrypoint:
      - /bin/sh
      - -c
      - umask 077 && printf '%s' "$$METRICS_TOKEN" > /tmp/metrics_token && sed -e "s|__METRICS_TARGET__|$$METRICS_TARGET|" -e "s|__METRICS_SCHEME__|$$METRICS_SCHEME|" /etc/prometheus/prometheus.yml.tpl > /tmp/prometheus.yml && exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=7d
    expose:
      - "9090"
    ports:
      - "${COMPANIONS_BIND:-127.0.0.1}:19090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml.tpl:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - promdata:/prometheus
    depends_on:
      app:
        condition: service_healthy

  # Мониторинг: доступен только через Caddy по /grafana, анонимный доступ выключен.
  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?нет GRAFANA_ADMIN_PASSWORD в .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://${PROD_DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    expose:
      - "3000"
    ports:
      - "${COMPANIONS_BIND:-127.0.0.1}:13000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

  # Разовая задача: создаёт учётку жюри (viewer) и завершается.
  grafana-init:
    image: curlimages/curl:8.11.0
    restart: "no"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?нет GRAFANA_ADMIN_PASSWORD в .env}
      JURY_PASSWORD: ${GRAFANA_JURY_PASSWORD:?нет GRAFANA_JURY_PASSWORD в .env}
    volumes:
      - ./grafana/init-viewer.sh:/init-viewer.sh:ro
    entrypoint: ["/bin/sh", "/init-viewer.sh"]
    depends_on:
      - grafana

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      PROD_DOMAIN: ${PROD_DOMAIN:?нет PROD_DOMAIN в .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  promdata:
  grafanadata:
  # Не пересоздавать caddy_data: там сертификат (лимит Let's Encrypt — 5 в неделю на домен).
  caddy_data:
  caddy_config:
  kcdata:
