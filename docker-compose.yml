# Запуск: cp .env.example .env, задать пароли, docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Порт намеренно не публикуется: база доступна только приложению внутри сети Compose.

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@postgres:5432/app?sslmode=disable
      HTTP_ADDR: ":8080"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    # В образе distroless нет shell и curl: проверка запускает сам бинарь.
    healthcheck:
      test: ["CMD", "/api", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Имитация REST-биллинга для опроса (BILLING_URL=http://mock-billing:8081/snapshot.json).
  # Отдаёт файл набора организаторов; Authorization не проверяет. Включается профилем billing:
  #   COMPOSE_PROFILES=billing. Адаптер под наш контракт: формат API aéza неизвестен.
  mock-billing:
    image: busybox:1.37
    profiles: ["billing"]
    restart: unless-stopped
    command: ["httpd", "-f", "-p", "8081", "-h", "/srv"]
    volumes:
      - ./backend/internal/source/seed/organizers.json:/srv/snapshot.json:ro
    expose:
      - "8081"

volumes:
  pgdata:
