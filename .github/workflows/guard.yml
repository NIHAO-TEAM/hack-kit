# .github/workflows/guard.yml
#
# Метка go:<id> — согласование изменения человеком и назначение исполнителя <id>.
# Её может ставить только человек из team.md. Поставил бот или посторонний — метка снимается.
#
# Если метку поставил человек и PR — черновик, guard будит исполнителя меткой wake:<id>:
# у каждого исполнителя одна routine с триггером на wake:<id>, и она по шагу 0
# в .github/agents/executor.md сама понимает, старт это или ответ на ревью.
# Routine исполнителя тоже проверяет, кто поставил go:<id>: это второй рубеж.

name: Guard

on:
  pull_request:
    types: [labeled]

jobs:
  go-label:
    if: startsWith(github.event.label.name, 'go:')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      PR: ${{ github.event.pull_request.number }}
      DRAFT: ${{ github.event.pull_request.draft }}
      ACTOR: ${{ github.event.sender.login }}
      ACTOR_TYPE: ${{ github.event.sender.type }}
      LABEL: ${{ github.event.label.name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: team.md
      - name: Метку ставил человек из team.md
        run: |
          # Логины людей — колонка «GitHub» таблицы «Люди» в team.md.
          humans=$(sed -n '/^## Люди/,/^## /p' team.md | grep -oE '`@[A-Za-z0-9-]+`' | tr -d '`@')
          if [ "$ACTOR_TYPE" != "User" ] || ! printf '%s\n' $humans | grep -qx "$ACTOR"; then
            gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --remove-label "$LABEL"
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" \
              --body "[guard] метка $LABEL снята: её поставил $ACTOR, а согласовывать могут только люди из team.md."
            exit 0
          fi
          echo "$LABEL поставил $ACTOR — ок"

          if [ "$DRAFT" != "true" ]; then
            echo "PR не черновик — старт не нужен, будить исполнителя не будем"; exit 0
          fi

          # Будильник снимается и ставится заново последним действием: новое событие labeled.
          id=${LABEL#go:}
          gh label create "wake:$id" --color 0E8A16 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
          gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --remove-label "wake:$id" >/dev/null 2>&1 || true
          gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --add-label "wake:$id"
          echo "разбудил $id меткой wake:$id"
