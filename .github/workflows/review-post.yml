# .github/workflows/review-post.yml
#
# Разбирает итог ревьюера-routine — комментарий, который начинается с «[review]»:
#   [review] round: N verdict: APPROVED|CHANGES_REQUESTED
#   head: <40-символьный sha>
# Проверяет формат, автора (ревьюер из team.md) и что head не устарел, затем ставит метки:
# round-N (или needs-human за замечания после MAX_ROUNDS-го), protected, статус merge-gate на head,
# и последним — комментарий бота «[ci] итог ревью принят …»: по нему просыпается подписанная на PR сессия исполнителя.
# Итог «CI красный» публикует ci.yml сам (от github-actions[bot], сюда не попадает).

name: Review post

on:
  issue_comment:
    types: [created]

jobs:
  post:
    # Только владелец и коллабораторы: в публичном репозитории комментировать может любой, а отказ ниже
    # ставит needs-human — посторонний «[review]» иначе останавливал бы чужой PR.
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '[review]') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    concurrency:
      group: review-post-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    env:
      PR: ${{ github.event.issue.number }}
      AUTHOR: ${{ github.event.comment.user.login }}
      BODY: ${{ github.event.comment.body }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            team.md
            .github/workflows/protected-paths.txt
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Разобрать итог
        id: parse
        run: |
          needs_human() {
            gh label create needs-human --color B60205 >/dev/null 2>&1 || true
            gh pr edit "$PR" --add-label needs-human || true
            gh pr comment "$PR" --body "[ci] $1 Нужен человек."
            exit 0
          }
          reviewers=$(sed -n '/^## Ревьюер/,/^## /p' team.md | grep -oE '`@[A-Za-z0-9-]+`' | tr -d '`@')
          printf '%s\n' $reviewers | grep -qx "$AUTHOR" \
            || needs_human "Итог [review] оставил $AUTHOR, а ревьюер в team.md — ${reviewers:-не указан}. Итог не принят."
          first=$(printf '%s\n' "$BODY" | sed -n '1p' | tr -d '\r')
          second=$(printf '%s\n' "$BODY" | sed -n '2p' | tr -d '\r')
          n=$(printf '%s' "$first" | sed -nE 's/^\[review\] round: ([0-9]+) verdict: (APPROVED|CHANGES_REQUESTED)$/\1/p')
          verdict=$(printf '%s' "$first" | sed -nE 's/^\[review\] round: ([0-9]+) verdict: (APPROVED|CHANGES_REQUESTED)$/\2/p')
          head=$(printf '%s' "$second" | sed -nE 's/^head: ([0-9a-f]{40})$/\1/p')
          [ -n "$n" ] && [ -n "$verdict" ] && [ -n "$head" ] \
            || needs_human "Итог ревью в неверном формате: первые строки должны быть «[review] round: N verdict: APPROVED|CHANGES_REQUESTED» и «head: <sha>»."
          now=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          if [ "$now" != "$head" ]; then
            gh pr comment "$PR" --body "[ci] итог ревью про $head, а head PR уже $now — итог устарел, ревью запросит следующий прогон CI."
            exit 0
          fi
          { echo "n=$n"; echo "verdict=$verdict"; echo "head=$head"; echo "ok=true"; } >> "$GITHUB_OUTPUT"

      - name: Метки и будильник исполнителя
        if: steps.parse.outputs.ok == 'true'
        env:
          N: ${{ steps.parse.outputs.n }}
          VERDICT: ${{ steps.parse.outputs.verdict }}
          HEAD_SHA: ${{ steps.parse.outputs.head }}
        run: |
          # Лимит раундов тот же, что MAX_ROUNDS в .github/agents/executor.md. Раунды считает ревьюер,
          # красный CI в счёт не идёт. Одобренный PR под лимит не попадает: needs-human только за замечания.
          MAX_ROUNDS=4
          for l in round-1 round-2 round-3 round-4 needs-human protected; do gh label create "$l" >/dev/null 2>&1 || true; done
          for l in round-1 round-2 round-3 round-4; do gh pr edit "$PR" --remove-label "$l" >/dev/null 2>&1 || true; done
          if [ "$N" -le "$MAX_ROUNDS" ]; then
            gh pr edit "$PR" --add-label "round-$N"
          elif [ "$VERDICT" = "CHANGES_REQUESTED" ]; then
            gh pr edit "$PR" --add-label needs-human
          fi

          files=$(gh pr diff "$PR" --name-only)
          if printf '%s\n' "$files" | grep -qE -f .github/workflows/protected-paths.txt; then
            gh pr edit "$PR" --add-label protected
          fi
          # Ручного слияния нет (решение владельца 23.10: агенты сливают всё, чтобы ночью работа не вставала).
          # protected и contract-breaking — сигналы ревьюеру, вердикт за ним. Старую метку manual-merge снимаем.
          gh pr edit "$PR" --remove-label manual-merge >/dev/null 2>&1 || true

          # Статус merge-gate на head: success для APPROVED без needs-human. Исполнитель сливает только при нём;
          # при защите ветки (обязательная проверка merge-gate) иначе «gh pr merge» не пройдёт.
          labels=$(gh pr view "$PR" --json labels --jq '.labels[].name')
          gate=failure; why="ревью: $VERDICT"
          if [ "$VERDICT" = "APPROVED" ]; then
            if printf '%s\n' "$labels" | grep -qx needs-human; then why="нужен человек (needs-human)"
            else gate=success; why="APPROVED, сливает агент"; fi
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state="$gate" -f context=merge-gate -f description="$why" >/dev/null

          # Последним: сигнал исполнителю от бота. Сессия исполнителя подписана на события PR,
          # а события от собственного аккаунта подписка может не присылать — ревьюер пишет
          # от аккаунта человека, поэтому итог дублируется комментарием github-actions[bot].
          gh pr comment "$PR" --body "$(printf '[ci] итог ревью принят: round %s verdict: %s\nhead: %s' "$N" "$VERDICT" "$HEAD_SHA")"

      # 24.10: subscribe_pr_activity не работает ни у одного исполнителя, сессия кончается на [wait], и итог
      # ждал сторожа 20–35 мин. Будим routine исполнителя сразу; перезапуск по шагу 0 executor.md.
      - name: Разбудить исполнителя
        if: steps.parse.outputs.ok == 'true'
        env:
          FIRE_EXEC_1_URL: ${{ secrets.FIRE_EXEC_1_URL }}
          FIRE_EXEC_1_TOKEN: ${{ secrets.FIRE_EXEC_1_TOKEN }}
          FIRE_EXEC_2_URL: ${{ secrets.FIRE_EXEC_2_URL }}
          FIRE_EXEC_2_TOKEN: ${{ secrets.FIRE_EXEC_2_TOKEN }}
          FIRE_EXEC_3_URL: ${{ secrets.FIRE_EXEC_3_URL }}
          FIRE_EXEC_3_TOKEN: ${{ secrets.FIRE_EXEC_3_TOKEN }}
          FIRE_EXEC_4_URL: ${{ secrets.FIRE_EXEC_4_URL }}
          FIRE_EXEC_4_TOKEN: ${{ secrets.FIRE_EXEC_4_TOKEN }}
          FIRE_EXEC_5_URL: ${{ secrets.FIRE_EXEC_5_URL }}
          FIRE_EXEC_5_TOKEN: ${{ secrets.FIRE_EXEC_5_TOKEN }}
        run: |
          labels=$(gh pr view "$PR" --json labels --jq '.labels[].name')
          printf '%s\n' "$labels" | grep -qx needs-human && exit 0
          id=$(printf '%s\n' "$labels" | sed -n 's/^go://p' | head -n1)
          [ -n "$id" ] || exit 0
          # Будим только сессию без подписки (её последний ответ — «[wait] … нет подписки»): подписанная
          # сессия жива и получит итог сама, вторая сессия на том же PR (24.10 #82, exec-4) только мешает.
          last=$(gh pr view "$PR" --json comments --jq '[.comments[] | select(.body | test("^\\[(start|fix|merge|wait|needs-human)\\]"))] | last | .body // ""')
          case "$last" in "[wait]"*"нет подписки"*) ;; *) exit 0 ;; esac
          sid=$(printf '%s' "$id" | tr 'a-z-' 'A-Z_')
          url_var="FIRE_${sid}_URL"; token_var="FIRE_${sid}_TOKEN"
          gh pr comment "$PR" --body "[guard] перезапуск исполнителя $id (итог ревью): пришёл итог, подписки у сессии нет. Прошлая сессия считается завершённой, новая перехватывает PR."
          FIRE_URL=${!url_var:-} FIRE_TOKEN=${!token_var:-} bash .github/scripts/fire.sh "PR #$PR в $GITHUB_REPOSITORY, исполнитель $id, перезапуск (итог ревью)" || true
