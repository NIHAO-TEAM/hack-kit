# .github/workflows/deploy-layout.yml
#
# Вёрстка прода на телефоне и планшете после успешной дымовой проверки (Deploy smoke) и вручную.
# Тест — e2e/tests/layout.spec.ts: экраны jury, 390 и 820 px, тёмная тема, без горизонтальной
# прокрутки страницы, цели касания от 44 px на планшете. Красный запуск — сигнал, а не гейт слияния.
#
# Нужна переменная репозитория PROD_DOMAIN и секрет E2E_JURY_PASSWORD.

name: Deploy layout

on:
  workflow_run:
    workflows: [Deploy smoke]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-layout
  cancel-in-progress: false

jobs:
  layout:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROD_DOMAIN: ${{ vars.PROD_DOMAIN }}
      E2E_JURY_PASSWORD: ${{ secrets.E2E_JURY_PASSWORD }}
    steps:
      - name: Проверка настроек
        run: |
          if [ -z "$PROD_DOMAIN" ]; then echo "::error::не задана переменная репозитория PROD_DOMAIN"; exit 1; fi
          if [ -z "$E2E_JURY_PASSWORD" ]; then echo "::error::нет секрета E2E_JURY_PASSWORD"; exit 1; fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Playwright и Firefox
        working-directory: e2e
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.49.1
          npx playwright install --with-deps firefox

      - name: Вёрстка по проду
        working-directory: e2e
        env:
          E2E_BASE_URL: https://${{ vars.PROD_DOMAIN }}
          CI: "true"
        run: npx playwright test layout --retries=1 --reporter=list

      - name: Скриншоты нарушений
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: layout-screenshots
          path: e2e/test-results/**/*.png
          retention-days: 3
          if-no-files-found: ignore
