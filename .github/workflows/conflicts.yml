# .github/workflows/conflicts.yml
#
# После каждого слияния в main будит исполнителей, чьи PR стали CONFLICTING: для таких PR GitHub не запускает
# CI, ревью не приходит, и работа молча стоит. Логика — .github/scripts/conflicts.sh.

name: Conflicts

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: conflicts
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  conflicts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN_SHA: ${{ github.sha }}
      # Секреты по именам, как в watchdog.yml (toJSON(secrets) GitHub блокирует в публичном репозитории).
      FIRE_EXEC_1_URL: ${{ secrets.FIRE_EXEC_1_URL }}
      FIRE_EXEC_1_TOKEN: ${{ secrets.FIRE_EXEC_1_TOKEN }}
      FIRE_EXEC_2_URL: ${{ secrets.FIRE_EXEC_2_URL }}
      FIRE_EXEC_2_TOKEN: ${{ secrets.FIRE_EXEC_2_TOKEN }}
      FIRE_EXEC_3_URL: ${{ secrets.FIRE_EXEC_3_URL }}
      FIRE_EXEC_3_TOKEN: ${{ secrets.FIRE_EXEC_3_TOKEN }}
      FIRE_EXEC_4_URL: ${{ secrets.FIRE_EXEC_4_URL }}
      FIRE_EXEC_4_TOKEN: ${{ secrets.FIRE_EXEC_4_TOKEN }}
      FIRE_EXEC_5_URL: ${{ secrets.FIRE_EXEC_5_URL }}
      FIRE_EXEC_5_TOKEN: ${{ secrets.FIRE_EXEC_5_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Дать GitHub пересчитать слияемость
        run: sleep 45

      - name: Разбудить исполнителей PR в конфликте
        run: bash .github/scripts/conflicts.sh
