# .github/workflows/ai-review.yml
#
# Оспаривание итога исполнителем: комментарий «[fix] round N: правок нет, замечания оспорены».
# Код не менялся, поэтому новый прогон CI сам не начнётся. Здесь решаем, что перезапустить:
#
#   - оспорен итог «CI красный» (строка «source: ci») — нестабильный тест: перезапускаем CI
#     на этом коммите, дальше всё как обычно (ci.yml);
#   - оспорен итог ревьюера — тесты на этом head уже зелёные: снова запрашиваем ревью
#     комментарием «[ci] … оспаривание» и меткой review-me (routine reviewer).

name: AI Review

on:
  issue_comment:
    types: [created]

jobs:
  dispute:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '[fix]') &&
      contains(github.event.comment.body, 'замечания оспорены')
    concurrency:
      group: ai-review-dispute-${{ github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
    env:
      PR: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Что перезапустить
        id: what
        run: |
          read -r state draft base head <<<"$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" \
            --json state,isDraft,baseRefName,headRefOid \
            --jq '"\(.state) \(.isDraft) \(.baseRefName) \(.headRefOid)"')"
          if [ "$state" != "OPEN" ] || [ "$draft" = "true" ] || [ "$base" != "main" ]; then
            echo "PR закрыт, черновик или не в main — пропуск"; exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("[review]"))]' | jq -s 'add // []' > "$RUNNER_TEMP/history.json"
          last=$(jq -r 'last | .body // ""' "$RUNNER_TEMP/history.json")
          last_head=$(printf '%s\n' "$last" | sed -n 's/^head: *//p' | head -n1 | tr -d '\r')

          read -r ci_id ci_status <<<"$(gh run list -R "$GITHUB_REPOSITORY" --workflow CI --commit "$head" \
            --event pull_request --limit 1 --json databaseId,status \
            --jq '.[0] | "\(.databaseId) \(.status)"')"
          if [ -z "$ci_id" ] || [ "$ci_id" = "null" ] || [ "$ci_status" != "completed" ]; then
            echo "CI на $head ещё идёт — итог придёт от него"; exit 0
          fi
          if [ "$last_head" != "$head" ]; then
            echo "последний итог не про текущий head — оспаривать нечего"; exit 0
          fi

          if printf '%s\n' "$last" | grep -q '^source: ci'; then
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" \
              --body "[ci] CI на $head перезапущен по оспариванию исполнителя; итог придёт после него."
            gh run rerun "$ci_id" -R "$GITHUB_REPOSITORY"
            exit 0
          fi

          # Раунд = число прошлых итогов с CHANGES_REQUESTED + 1.
          n=$(( $(jq '[.[] | select(.body | test("verdict: CHANGES_REQUESTED"))] | length' "$RUNNER_TEMP/history.json") + 1 ))

          # Будильники снимаются до любых других меток, review-me ставится последним.
          for l in $(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json labels \
              --jq '.labels[].name | select(startswith("wake:") or . == "review-me")'); do
            gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --remove-label "$l" || true
          done
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" \
            --body "$(printf '[ci] оспаривание: ревью запрошено повторно\nround: %s\nhead: %s' "$n" "$head")"
          { echo "n=$n"; echo "head=$head"; echo "fire=true"; } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.what.outputs.fire == 'true'
        with:
          sparse-checkout: .github/scripts

      # Ревьюер — routine с API-триггером (секреты FIRE_REVIEWER_URL / FIRE_REVIEWER_TOKEN).
      - name: Запустить ревьюера
        if: steps.what.outputs.fire == 'true'
        env:
          FIRE_URL: ${{ secrets.FIRE_REVIEWER_URL }}
          FIRE_TOKEN: ${{ secrets.FIRE_REVIEWER_TOKEN }}
          N: ${{ steps.what.outputs.n }}
          HEAD_SHA: ${{ steps.what.outputs.head }}
        run: |
          if ! bash .github/scripts/fire.sh "PR #$PR в $GITHUB_REPOSITORY: повторное ревью по оспариванию, round $N, head $HEAD_SHA"; then
            gh label create needs-human --color B60205 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
            gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --add-label needs-human || true
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "[ci] не удалось запустить ревьюера через API-триггер (секреты FIRE_REVIEWER_URL/_TOKEN). Нужен человек."
            exit 1
          fi
