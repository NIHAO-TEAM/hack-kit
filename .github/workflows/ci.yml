# .github/workflows/ci.yml
#
# Проверки PR в main и запрос ревью. Модель здесь не запускается: ревьюер — routine
# на claude.ai-аккаунте человека (.github/agents/reviewer.md), секрет токена не нужен.
#
#   prep ── go-generate, go-lint, go-test, web (параллельно) ── checks ──┬─ зелёный → [ci] «ревью запрошено» + API-триггер routine reviewer
#                                                                    └─ красный → итог «[review] … source: ci» от бота → сессия исполнителя (подписка на PR)
#
# Итог ревьюера ([review] …) разбирает review-post.yml: раунд, protected, merge-gate, сигнал исполнителю от бота.
# Оспаривание исполнителем — ai-review.yml.
#
# Исполнитель — одна сессия на PR, подписана на события PR; его будят комментарии бота.
#
# Тесты с БД без PostgreSQL пропускаются (t.Skip). Здесь база есть всегда, и любой пропуск
# считается падением: иначе сторожа инвариантов могли бы молча не запуститься.
#
# Один раз (люди): Settings → Actions → General → Workflow permissions: Read and write;
# Settings → Branches → main → Require status checks: «checks».

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Состояние PR: номер раунда и нужно ли ревью на этот head.
  prep:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    env:
      PR: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      skip: ${{ steps.pr.outputs.skip }}
      n: ${{ steps.pr.outputs.n }}
      head: ${{ steps.pr.outputs.head }}
      draft: ${{ steps.pr.outputs.draft }}
      go: ${{ steps.pr.outputs.go }}
      web: ${{ steps.pr.outputs.web }}
    steps:
      - name: Состояние PR
        id: pr
        run: |
          read -r state draft base head <<<"$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" \
            --json state,isDraft,baseRefName,headRefOid \
            --jq '"\(.state) \(.isDraft) \(.baseRefName) \(.headRefOid)"')"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          # Какие задания нужны. Список файлов не получили — гоняем всё.
          if files=$(gh pr diff "$PR" -R "$GITHUB_REPOSITORY" --name-only); then
            grep -qE '^(backend/|api/|tests/|\.github/workflows/ci\.yml$)' <<<"$files" && go=true || go=false
            grep -qE '^(frontend/|api/|\.github/workflows/ci\.yml$)' <<<"$files" && web=true || web=false
          else
            go=true; web=true
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"; echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "задания: go=$go web=$web, черновик=$draft"
          if [ "$state" != "OPEN" ] || [ "$draft" = "true" ] || [ "$base" != "main" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "PR закрыт, черновик или не в main — ревью не нужно"; exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("[review]"))]' | jq -s 'add // []' > history.json
          # Итог на этот head уже есть (например, reopened без новых коммитов) — второй раз не ревьюим.
          # Перезапуск (run_attempt > 1) делается по оспариванию итога «CI красный» — его ревьюим.
          last_head=$(jq -r 'last | .body // ""' history.json | sed -n 's/^head: *//p' | head -n1)
          if [ "$last_head" = "$head" ] && [ "$GITHUB_RUN_ATTEMPT" = "1" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "head $head уже проверен — пропуск"; exit 0
          fi
          # Раунд = число прошлых итогов ревьюера с CHANGES_REQUESTED + 1. Итоги «CI красный» (source: ci) не считаются:
          # два сбоя сети не должны съедать раунды правок.
          prev=$(jq '[.[] | select((.body | test("verdict: CHANGES_REQUESTED")) and (.body | test("\nsource: ci") | not))] | length' history.json)
          echo "n=$((prev + 1))" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

  # Проверки идут четырьмя параллельными заданиями: время CI = самое долгое из них, а не сумма.
  # Черновики не проверяются: исполнитель пушит после каждой задачи и гоняет make check сам.
  # Задания Go не запускаются, если PR не трогает backend/, api/, tests/; фронтенд — если не трогает frontend/, api/.
  # «checks» — сводное задание: его требует защита ветки, по нему route решает «ревью» или «CI красный».
  go-generate:
    needs: prep
    if: ${{ !cancelled() && (github.event_name == 'push' || (needs.prep.outputs.draft == 'false' && needs.prep.outputs.go == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Сгенерированный код совпадает с контрактом
        working-directory: backend
        run: |
          {
            echo "### Сгенерированный код совпадает с контрактом"
            make generate
            git diff --exit-code || { echo "make generate дал дифф: сгенерированный код не совпадает с api/openapi.yaml"; exit 1; }
          } 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - name: gofmt
        working-directory: backend
        run: |
          {
            echo "### gofmt"
            out=$(gofmt -l $(git ls-files '*.go'))
            if [ -n "$out" ]; then echo "Не отформатировано gofmt:"; echo "$out"; exit 1; fi
          } 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - name: Хвост лога
        if: failure()
        run: mkdir -p "$RUNNER_TEMP/part" && tail -n 80 "$RUNNER_TEMP/ci.log" > "$RUNNER_TEMP/part/go-generate.txt" 2>/dev/null || echo "Упала подготовка (checkout, setup-go)." > "$RUNNER_TEMP/part/go-generate.txt"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ci-part-go-generate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/part/
          retention-days: 3

  go-lint:
    needs: prep
    if: ${{ !cancelled() && (github.event_name == 'push' || (needs.prep.outputs.draft == 'false' && needs.prep.outputs.go == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go vet и golangci-lint (границы модулей)
        working-directory: backend
        # Линтер ставится отдельно с повторами: сбой proxy.golang.org не должен краснить PR
        # (так было 20.10.2026 и стоило исполнителю раунда оспаривания).
        run: |
          {
            echo "### go vet и golangci-lint"
            go vet ./...
            for i in 1 2 3; do
              go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6 && break
              [ "$i" = 3 ] && { echo "golangci-lint не скачался за 3 попытки"; exit 1; }
              sleep $((i * 10))
            done
            "$(go env GOPATH)/bin/golangci-lint" run ./...
          } 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - name: Хвост лога
        if: failure()
        run: mkdir -p "$RUNNER_TEMP/part" && tail -n 80 "$RUNNER_TEMP/ci.log" > "$RUNNER_TEMP/part/go-lint.txt" 2>/dev/null || echo "Упала подготовка (checkout, setup-go)." > "$RUNNER_TEMP/part/go-lint.txt"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ci-part-go-lint-${{ github.run_attempt }}
          path: ${{ runner.temp }}/part/
          retention-days: 3

  go-test:
    needs: prep
    if: ${{ !cancelled() && (github.event_name == 'push' || (needs.prep.outputs.draft == 'false' && needs.prep.outputs.go == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/ci?sslmode=disable
      INVARIANTS_DATABASE_URL: postgres://ci:ci@localhost:5432/ci?sslmode=disable
    # Явный bash = -eo pipefail: без него «… | tee» скрыл бы код падения проверки.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go test -race (с PostgreSQL)
        working-directory: backend
        # -p 1: пакеты с БД работают с одной базой и не должны идти параллельно.
        run: |
          {
            echo "### go test -race"
            set +e
            go test -race -p 1 -count=1 -v ./... > "$RUNNER_TEMP/go-test.log" 2>&1
            status=$?
            set -e
            grep -E '^(--- FAIL|FAIL|ok|panic:)' "$RUNNER_TEMP/go-test.log" || true
            if grep -q -- '--- SKIP' "$RUNNER_TEMP/go-test.log"; then
              echo "Тесты пропущены, хотя PostgreSQL есть:"; grep -- '--- SKIP' "$RUNNER_TEMP/go-test.log"; exit 1
            fi
            exit "$status"
          } 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - name: Хвост лога
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/part"
          {
            if [ -s "$RUNNER_TEMP/go-test.log" ] && grep -qE -- '--- FAIL|^panic:' "$RUNNER_TEMP/go-test.log"; then
              echo "### упавшие тесты Go"
              grep -E -B2 -A20 -- '--- FAIL|^panic:' "$RUNNER_TEMP/go-test.log" | head -n 150 || true
            fi
            if [ -s "$RUNNER_TEMP/ci.log" ]; then tail -n 80 "$RUNNER_TEMP/ci.log"; else echo "Упала подготовка (checkout, setup-go, PostgreSQL)."; fi
          } > "$RUNNER_TEMP/part/go-test.txt"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ci-part-go-test-${{ github.run_attempt }}
          path: ${{ runner.temp }}/part/
          retention-days: 3

  web:
    needs: prep
    if: ${{ !cancelled() && (github.event_name == 'push' || (needs.prep.outputs.draft == 'false' && needs.prep.outputs.web == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Фронтенд — pnpm check (типы, линтеры, слои, контраст, тесты, сборка, CSS)
        working-directory: frontend
        run: |
          {
            echo "### pnpm check"
            pnpm install --frozen-lockfile
            pnpm check
          } 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - name: Хвост лога
        if: failure()
        run: mkdir -p "$RUNNER_TEMP/part" && tail -n 80 "$RUNNER_TEMP/ci.log" > "$RUNNER_TEMP/part/web.txt" 2>/dev/null || echo "Упала подготовка (checkout, pnpm, node)." > "$RUNNER_TEMP/part/web.txt"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ci-part-web-${{ github.run_attempt }}
          path: ${{ runner.temp }}/part/
          retention-days: 3

  # Сводная проверка. Пропущенное по фильтру путей задание считается пройденным; упавшее или отменённое — нет.
  # Хвосты упавших заданий собираются в артефакт ci-tail-<попытка>: его читает route для итога «CI красный».
  checks:
    needs: [prep, go-generate, go-lint, go-test, web]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Итог проверок
        env:
          EVENT: ${{ github.event_name }}
          PREP: ${{ needs.prep.result }}
          DRAFT: ${{ needs.prep.outputs.draft }}
          GO_GENERATE: ${{ needs.go-generate.result }}
          GO_LINT: ${{ needs.go-lint.result }}
          GO_TEST: ${{ needs.go-test.result }}
          WEB: ${{ needs.web.result }}
        run: |
          if [ "$EVENT" = "pull_request" ] && [ "$PREP" != "success" ]; then echo "prep: $PREP"; exit 1; fi
          if [ "$DRAFT" = "true" ]; then echo "Черновик: проверки запустятся, когда PR будет готов к ревью."; exit 0; fi
          bad=0
          for pair in "go-generate=$GO_GENERATE" "go-lint=$GO_LINT" "go-test=$GO_TEST" "web=$WEB"; do
            echo "$pair"
            case "${pair#*=}" in success|skipped) ;; *) bad=1 ;; esac
          done
          exit "$bad"

      - uses: actions/download-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          pattern: ci-part-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/parts
          merge-multiple: true

      - name: Хвост лога для исполнителя
        if: failure()
        run: |
          {
            found=0
            for f in "$RUNNER_TEMP"/parts/*.txt; do
              [ -s "$f" ] || continue
              found=1
              echo "### задание $(basename "$f" .txt)"
              cat "$f"
            done
            [ "$found" = 1 ] || echo "Хвостов нет: задание отменено или упала подготовка. См. лог запуска."
          } > "$RUNNER_TEMP/ci-tail.txt"
          cat "$RUNNER_TEMP/ci-tail.txt"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ci-tail-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-tail.txt
          retention-days: 3

  # Зелёные тесты → запрос ревью. Красные → итог «CI красный» и будильник исполнителя.
  route:
    needs: [prep, checks]
    if: ${{ !cancelled() && needs.prep.result == 'success' && needs.prep.outputs.skip == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    env:
      PR: ${{ github.event.pull_request.number }}
      N: ${{ needs.prep.outputs.n }}
      HEAD_SHA: ${{ needs.prep.outputs.head }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: head не сменился
        id: fresh
        run: |
          now=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          if [ "$now" != "$HEAD_SHA" ]; then echo "head сменился ($HEAD_SHA → $now) — пропуск"; exit 0; fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.fresh.outputs.ok == 'true' && needs.checks.result == 'success'
        with:
          sparse-checkout: .github/scripts

      # Ревьюер — routine с API-триггером (секреты FIRE_REVIEWER_URL / FIRE_REVIEWER_TOKEN).
      - name: Запросить ревью
        if: steps.fresh.outputs.ok == 'true' && needs.checks.result == 'success'
        env:
          FIRE_URL: ${{ secrets.FIRE_REVIEWER_URL }}
          FIRE_TOKEN: ${{ secrets.FIRE_REVIEWER_TOKEN }}
        run: |
          # Правка контракта: список изменений от oasdiff и метка contract-breaking (сигнал ревьюеру). До запроса ревью,
          # чтобы ревьюер видел список. Скрипт упал — ставим contract-breaking: ревьюер проверит контракт вручную.
          if ! bash .github/scripts/contract-diff.sh; then
            gh label create contract-breaking --color B60205 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
            gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --add-label contract-breaking || true
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "[ci] контракт: проверка api/openapi.yaml не выполнена (лог запуска), метка contract-breaking: ревьюер проверяет контракт вручную." || true
          fi
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "$(printf '[ci] checks зелёные, ревью запрошено\nround: %s\nhead: %s' "$N" "$HEAD_SHA")"
          if ! bash .github/scripts/fire.sh "PR #$PR в $GITHUB_REPOSITORY: ревью, round $N, head $HEAD_SHA"; then
            gh label create needs-human --color B60205 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
            gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --add-label needs-human || true
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "[ci] не удалось запустить ревьюера через API-триггер (секреты FIRE_REVIEWER_URL/_TOKEN). Нужен человек."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        if: steps.fresh.outputs.ok == 'true' && needs.checks.result != 'success'
        continue-on-error: true
        with:
          name: ci-tail-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-tail

      - name: Итог «CI красный»
        if: steps.fresh.outputs.ok == 'true' && needs.checks.result != 'success'
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          job_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            --jq '.jobs[] | select(.name == "checks") | .id' | head -n1)
          {
            echo "[review] round: $N verdict: CHANGES_REQUESTED"
            echo "head: $HEAD_SHA"
            echo "source: ci"
            echo
            echo "🚨 1, ⚠️ 0, 💬 0 — CI красный (${{ needs.checks.result }}), ревью не запрашивалось."
            echo
            echo "1. 🚨 **CI красный:** задание «checks» не прошло на этом коммите. Лог: $run_url"
            echo "   Воспроизведи падение локально и почини. Если падение не связано с этим PR (нестабильный тест) —"
            echo "   оспорь итог: CI перезапустится на том же коммите."
            echo
            echo "Хвост лога:"
            echo
            echo '```'
            # Хвост собран в задании checks (артефакт). Нет артефакта — запасной путь через API логов.
            tail_file="$RUNNER_TEMP/ci-tail/ci-tail.txt"
            if [ -s "$tail_file" ]; then
              head -n 250 "$tail_file" | sed 's/```/ʼʼʼ/g'
            else
              { gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/logs" 2>/dev/null \
                  | sed 's/^[0-9TZ:.-]* //' | grep -E -A15 -- '--- FAIL|^FAIL|panic:|##\[error\]|Не отформатировано|Тесты пропущены|error TS|Error:|не скачался|dial tcp|stream error|INTERNAL_ERROR' \
                  | tail -n 120; } || echo "(лог недоступен, см. ссылку)"
            fi
            echo '```'
          } > body.md
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body-file body.md
          # Метки раундов не трогаем: красный CI раундом не считается. Исполнитель останавливается сам
          # после MAX_CI_RED красных подряд (executor.md); это страховка на случай, если он потерял счёт
          # (перезапуск сессии): серия красных итогов подряд без единого итога ревьюера → needs-human.
          CI_RED_BACKSTOP=5
          streak=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("[review]")) | if (.body | test("\nsource: ci")) then "ci" else "rv" end' \
            | tac | awk '$0 == "ci" {n++; next} {exit} END {print n + 0}')
          if [ "$streak" -ge "$CI_RED_BACKSTOP" ]; then
            gh label create needs-human --color B60205 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
            gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --add-label needs-human
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "[ci] CI красный $streak раз подряд без ревью — нужен человек."
          fi
          # Итог от github-actions[bot] сам приходит в подписку сессии исполнителя: будильник не нужен.

  # Красный main — сигнал людям: защита ветки этого не допускает,
  # значит, что-то прошло в обход или тесты нестабильны.
  main-alert:
    needs: checks
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "$TOKEN" ] || { echo "TELEGRAM_BOT_TOKEN не задан"; exit 0; }
          curl -s "https://api.telegram.org/bot$TOKEN/sendMessage" -d chat_id="$CHAT" \
            -d text="CI на main красный: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
