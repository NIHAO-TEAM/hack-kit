# .github/workflows/deploy-burst.yml
#
# Залп событий под нагрузкой (изменение load-burst-proof): стенд Compose на раннере, снимок 100 000 клиентов,
# залпы 3 000, 10 000 и 50 000 событий эмулятора «как можно быстрее» при 20 читателях очереди и 500 SSE-клиентах.
# Красный запуск — сигнал, а не гейт слияния: идёт после успешной дымовой проверки на main и вручную.
# Проверки и отчёт — docs/load/burst.sh. По проду залп не гоняем: он сбрасывает данные эмулятора.

name: Deploy burst

on:
  workflow_run:
    workflows: [Deploy smoke]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-burst
  cancel-in-progress: false

jobs:
  burst:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Значения одноразовые, живут только в этом job; в лог не попадают (add-mask).
      - name: Секреты стенда
        run: |
          cp .env.example .env
          for v in POSTGRES_PASSWORD ADMIN_PASSWORD METRICS_TOKEN SOURCE_TOKEN; do
            val=$(openssl rand -hex 16)
            echo "::add-mask::$val"
            echo "$v=$val" >> "$GITHUB_ENV"
            sed -i "s|^$v=.*|$v=$val|" .env
          done

      - name: Стенд
        run: docker compose up -d --build --wait --wait-timeout 600

      - name: Данные 100k
        run: |
          python3 cases/analizator/generate.py --accounts 100000 --services 300000 --transactions 1000000 --out "$RUNNER_TEMP/load"
          ls -l "$RUNNER_TEMP/load/data.json"

      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: '0.54.0'

      - name: Железо
        run: |
          {
            echo "## Железо раннера"
            echo '```'
            echo "vCPU: $(nproc)"
            grep MemTotal /proc/meminfo
            k6 version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Залпы 3 000 / 10 000 / 50 000
        run: |
          export APP_CONTAINER=$(docker compose ps -q app)
          export SNAPSHOT="$RUNNER_TEMP/load/data.json"
          export OUT="$RUNNER_TEMP/burst-out"
          docs/load/burst.sh 3000 10000 50000

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: burst
          path: ${{ runner.temp }}/burst-out/

      - name: Логи при падении
        if: failure()
        run: docker compose logs --tail 100 app

      - name: Остановка
        if: always()
        run: docker compose down -v
